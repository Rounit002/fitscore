# Render Blueprint — reproducible deploy config for the bitezsnap API and web app.
# Docs: https://render.com/docs/blueprint-spec
#
# IMPORTANT:
# - The service `name` below MUST match the EXISTING Render service (`fitscan-api`)
#   so Render UPDATES it instead of creating a duplicate. Rename here if your
#   service is named differently.
# - Env vars marked `sync: false` are NOT stored in git. Set their values once in
#   the Render dashboard (Environment tab); Render preserves them across deploys.
# - Render log streams are workspace-level dashboard integrations and cannot be
#   declared in a Blueprint. Follow MONITORING_SETUP.md after the service deploys.
# - The frontend service name below must match the existing Render static site.
#   Its catch-all rewrite is required for BrowserRouter routes to survive refreshes.

services:
  - type: web
    name: fitscan-api
    runtime: node
    plan: free
    rootDir: Backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Runtime
      - key: NODE_ENV
        value: production
      # Render injects PORT automatically; server.js reads process.env.PORT.

      # CORS — the frontend origin is already hardcoded in Backend/config/cors.js.
      # This is only needed to allow ADDITIONAL origins without a code change.
      - key: FRONTEND_URL
        value: https://fitscore-6hqp.onrender.com
      # Comma-separated extra origins (optional):
      # - key: FRONTEND_URLS
      #   value: https://another-frontend.example.com

      # PostgreSQL (set values in dashboard)
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        sync: false
      - key: DB_SSL_REJECT_UNAUTHORIZED
        sync: false
      # Optional PEM CA bundle when the provider uses a private certificate authority.
      - key: DB_SSL_CA
        sync: false

      # Auth
      - key: JWT_SECRET
        sync: false

      # AI (Gemini) — nutrition analysis
      - key: GEMINI_API_KEY
        sync: false

      # Cloudinary — scan image uploads
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Redis / job queue (optional — falls back to in-memory if unset)
      - key: REDIS_URL
        sync: false

      # RevenueCat subscriptions (optional)
      - key: REVENUECAT_SECRET_KEY
        sync: false
      - key: REVENUECAT_ENTITLEMENT_ID
        value: premium
      - key: REVENUECAT_WEBHOOK_AUTH
        sync: false
      - key: REVENUECAT_WEBHOOK_SIGNING_SECRET
        sync: false
      - key: REVENUECAT_APP_IDS
        sync: false

      # Google Play billing (optional/legacy)
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_PACKAGE_NAME
        sync: false
      - key: GOOGLE_RTDN_AUDIENCE
        sync: false
      - key: GOOGLE_RTDN_SERVICE_ACCOUNT
        sync: false
      - key: GOOGLE_SUBSCRIPTION_IDS
        sync: false

      # Play Integrity remains off until a signed Play-installed build passes
      # end-to-end verification. Enabling it rejects unattested entitlement calls.
      - key: PLAY_INTEGRITY_ENFORCEMENT_ENABLED
        value: "false"
      - key: PLAY_INTEGRITY_MAX_TOKEN_AGE_MS
        value: "120000"
      - key: PLAY_INTEGRITY_ALLOWED_CERT_DIGESTS
        sync: false

      # Razorpay payments (optional)
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  - type: web
    name: fitscore-6hqp
    runtime: static
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://fitscan-api.onrender.com
      - key: VITE_API_BASE_URL
        value: https://fitscan-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
